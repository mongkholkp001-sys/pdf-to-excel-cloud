version: '3.8'

services:
  pdf-excel-cloud:
    build: .
    container_name: pdf_to_excel_cloud
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    restart: unless-stopped
